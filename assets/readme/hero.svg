<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">宝贝学习乐园 — 4 岁宝宝互动学习工作台</title>
  <desc id="hero-desc">5 大模块卡片：字母乐园、古诗花园、数字王国、逻辑挑战、闯关冒险、徽章墙</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0F7"/>
      <stop offset="0.55" stop-color="#F6F1FF"/>
      <stop offset="1" stop-color="#EEF8FF"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8FB1"/>
      <stop offset=".2" stop-color="#FFB05A"/>
      <stop offset=".4" stop-color="#FFD86B"/>
      <stop offset=".6" stop-color="#8BD89E"/>
      <stop offset=".8" stop-color="#6BCFE3"/>
      <stop offset="1" stop-color="#B49CF7"/>
    </linearGradient>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- rainbow arc as a corner mark -->
  <path d="M 36 156 A 220 220 0 0 1 476 156" stroke="url(#rainbow)" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.55"/>
  <circle cx="36"  cy="156" r="9" fill="#FF8FB1"/>
  <circle cx="476" cy="156" r="9" fill="#B49CF7"/>

  <!-- a few candy dots -->
  <circle cx="96"  cy="60"  r="5" fill="#FFD86B"/>
  <circle cx="540" cy="42"  r="4" fill="#6BCFE3"/>
  <circle cx="600" cy="76"  r="3" fill="#FF8FB1"/>
  <circle cx="80"  cy="296" r="4" fill="#8BD89E"/>
  <circle cx="160" cy="320" r="5" fill="#B49CF7"/>
  <circle cx="520" cy="324" r="4" fill="#FFB05A"/>

  <!-- title block (left) -->
  <g transform="translate(64 80)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="22" font-weight="700" fill="#FF5C8A" letter-spacing="1">
      4 岁宝宝专属 · 互动学习工作台
    </text>
    <text y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="80" font-weight="800" fill="#2A2D3A">
      宝贝学习乐园
    </text>
    <text y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="28" font-weight="600" fill="#5A5E70">
      5 大模块 · 12 枚徽章 · 10 道关卡
    </text>
    <text y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" fill="#8A8DA0">
      零依赖 HTML / CSS / JS · 离线可用 · Web Speech 朗读
    </text>
  </g>

  <!-- 5 module tiles (right) -->
  <g transform="translate(688 70)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 字母 粉 -->
    <g transform="translate(0 0)">
      <rect width="160" height="110" rx="22" fill="#FFD8E6"/>
      <text x="20" y="48" font-size="36">🔤</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#A0274B">字母乐园</text>
      <text x="20" y="100" font-size="14" fill="#7C223E">26 字母卡片 + 配对</text>
    </g>
    <!-- 古诗 绿 -->
    <g transform="translate(170 0)">
      <rect width="160" height="110" rx="22" fill="#D8F4DD"/>
      <text x="20" y="48" font-size="36">🌸</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#1F6B36">古诗花园</text>
      <text x="20" y="100" font-size="14" fill="#155527">8 首 · 带拼音</text>
    </g>
    <!-- 数字 蓝 -->
    <g transform="translate(340 0)">
      <rect width="160" height="110" rx="22" fill="#D2EEF9"/>
      <text x="20" y="48" font-size="36">🔢</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#1B5173">数字王国</text>
      <text x="20" y="100" font-size="14" fill="#143E5A">0-20 · 加减 · 数数</text>
    </g>
    <!-- 逻辑 黄 -->
    <g transform="translate(0 122)">
      <rect width="160" height="110" rx="22" fill="#FFF1C9"/>
      <text x="20" y="48" font-size="36">🧩</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#7A5A12">逻辑挑战</text>
      <text x="20" y="100" font-size="14" fill="#5A4310">4 种题型题库</text>
    </g>
    <!-- 闯关 紫 -->
    <g transform="translate(170 122)">
      <rect width="160" height="110" rx="22" fill="#E2D8FA"/>
      <text x="20" y="48" font-size="36">🚀</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#3E2479">闯关冒险</text>
      <text x="20" y="100" font-size="14" fill="#2D1A5A">10 关 · 三星评级</text>
    </g>
    <!-- 徽章 橙 -->
    <g transform="translate(340 122)">
      <rect width="160" height="110" rx="22" fill="#FFE0CC"/>
      <text x="20" y="48" font-size="36">🏅</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#8A3B0E">徽章墙</text>
      <text x="20" y="100" font-size="14" fill="#6B2E0A">12 枚成就收集</text>
    </g>
  </g>
</svg>
